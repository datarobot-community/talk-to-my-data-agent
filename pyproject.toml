# Environment and pytest configuration for the repo-root integration suite
# (tests/, run by the Harness `e2e` pipeline's pytest flow, e.g. the
# weekly_pytest_e2e cron). Component apps manage their own environments in
# app_backend/, core/ and infra/; this project only pulls in what tests/ imports.
[project]
name = "data-analyst"
version = "0.1.0"
# Match core's floor: core is an editable dep, so a looser floor here makes
# uv's universal resolver fail on an unsatisfiable slice.
requires-python = ">=3.11,<3.14"
dependencies = [
    "core",
    # Declared for the imports in tests/, but left unpinned so core drives
    # their versions — re-pinning here is what broke resolution (stale
    # datarobot-genai<0.4 vs core's >=0.25.1).
    "datarobot",
    "datarobot-genai",
    "openai",
    "pandas",
    "plotly",
    "polars",
    # Test-only deps, not provided by core:
    "pytest>=8.3.4,<10.0",
    "pytest-asyncio>=1.0.0",
    "python-dotenv>=1.0.1",
]

[tool.uv]
package = false

[tool.uv.sources]
core = { path = "core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["core/src"]
markers = [
    "remote_datasource_concurrency: concurrency test for loading / interacting with remote datasources",
    "integration: mark test as integration (not run by default)",
]
addopts = '-m "not integration and not remote_datasource_concurrency"'
norecursedirs = ["tests/e2e"]
asyncio_default_fixture_loop_scope = "module"
filterwarnings = ["ignore::DeprecationWarning::"]
